<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Questionário — Re.Ciclo Maringá</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0d1117;--paper:#f5f0e8;--moss:#2d5016;--lime:#a8e63d;--mist:#e8f4d4;--mid:#6b7c52;--border:#d4cfc4;--red:#d94f3d}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--paper);color:var(--ink);line-height:1.6;min-height:100vh}
header{background:var(--moss);color:#fff;padding:1rem 1.2rem;display:flex;justify-content:space-between;align-items:center}
header a{color:var(--lime);text-decoration:none;font-size:.88rem;font-weight:700}
.logo{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:1.2rem}
.bar{height:6px;background:var(--border)}.bar div{height:100%;width:0;background:var(--lime);transition:width .4s}
main{max-width:720px;margin:0 auto;padding:2rem 1.2rem 4rem}
.step{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mid)}
h1{font-family:'Playfair Display',Georgia,serif;font-size:clamp(1.7rem,5vw,2.3rem);color:var(--moss);margin:.3rem 0 1.2rem;line-height:1.2}
.tcle{background:#fff;border:1px solid var(--border);border-radius:1rem;padding:1.1rem 1.2rem;font-size:.9rem;margin-bottom:1.4rem}
.q{background:#fff;border:1px solid var(--border);border-radius:1rem;padding:1.2rem;margin-bottom:1rem}
.q.err{border-color:var(--red);box-shadow:0 0 0 3px rgba(217,79,61,.15)}
.ql{display:block;font-weight:700;margin-bottom:.8rem}.ql i{color:var(--red);font-style:normal}
.opts{display:grid;gap:.5rem}
.opt{display:flex;gap:.6rem;align-items:center;border:1px solid var(--border);border-radius:.7rem;padding:.7rem .9rem;cursor:pointer;font-size:.93rem}
.opt:has(input:checked){background:var(--mist);border-color:var(--moss);font-weight:500}
.opt input{accent-color:var(--moss);width:1.1rem;height:1.1rem;flex:none}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:.5rem}.scale .opt{justify-content:center;padding:.7rem 0}
.sl{display:flex;justify-content:space-between;font-size:.75rem;color:var(--mid);margin-top:.4rem}
input[type=text],input[type=email],textarea{width:100%;border:1px solid var(--border);border-radius:.7rem;padding:.75rem .9rem;font:inherit;background:#fff}
textarea{min-height:90px;resize:vertical}
.warm{margin:-.4rem 0 1.3rem;color:var(--mid);font-size:1rem}
.hint{font-size:.8rem;color:var(--mid);margin-top:.4rem}
.nav{display:flex;gap:.8rem;margin-top:1.4rem}
button{font:inherit;font-weight:700;border:none;border-radius:999px;padding:.85rem 1.8rem;cursor:pointer}
.next{background:var(--moss);color:var(--lime);flex:1}.back{background:transparent;color:var(--moss);border:1px solid var(--moss)}
.end{text-align:center;padding:2rem 0}.end p{margin:.8rem 0 1.4rem;color:var(--mid)}
.end a{background:var(--moss);color:var(--lime);padding:.85rem 1.8rem;border-radius:999px;text-decoration:none;font-weight:700}
.warn{font-size:.8rem;color:#8a5a1e;background:#f3dfbf;border-radius:.6rem;padding:.5rem .8rem;margin-top:1rem}
</style>
</head>
<body>
<header><span class="logo">Re.Ciclo</span><a href="index.html">← Voltar ao site</a></header>
<div class="bar"><div id="prog"></div></div>
<main id="app"></main>
<script>
var BACKEND={url:'https://miqaubeveodxgqfqwvql.supabase.co',key:'sb_publishable_Gbm4W9W3Nlx6QnkLCA75eg_Jfiz5fyj'};
var PESQ={
  objetivo:'mapear a demanda e o descarte irregular de móveis e outros itens inservíveis em Maringá-PR, para apoiar propostas de pontos de entrega e reaproveitamento',
  coord:'Prof. Me. Lucas Forlin Pereira',
  equipe:'João Pedro Arraiz do Nascimento, Fernando Diniz Elizio e Raquel Bomfim Silva'
};
var SIM_TALVEZ=['Sim','Talvez, dependendo do preço e da qualidade'];
var Q={
 cidade:{t:'single',q:'Onde você mora?',o:['Maringá','Sarandi','Paiçandu','Marialva','Outro município']},
 bairro:{t:'text',q:'Qual é o seu bairro? (ou o município, se for de outro lugar)'},
 moradia:{t:'single',q:'Tipo de moradia',o:['Casa','Apartamento','Chácara ou sítio','Outro']},
 idade:{t:'single',q:'Faixa de idade',o:['18 a 24 anos','25 a 34 anos','35 a 44 anos','45 a 59 anos','60 anos ou mais']},
 veiculo:{t:'single',q:'Como você costuma transportar itens grandes?',o:['Tenho carro ou utilitário próprio','Peço emprestado','Contrato frete ou carreto','Não tenho como transportar']},
 itens:{t:'multi',q:'Nos últimos 12 meses, quais itens grandes você precisou descartar?',o:['Sofá ou estofados','Guarda-roupa ou armário','Mesa, cadeira ou estante','Cama ou colchão','Geladeira, fogão ou máquina de lavar','Eletrônicos','Pneus','Nenhum']},
 vezes:{t:'single',q:'Quantas vezes isso aconteceu nesse período?',o:['Nenhuma','1 vez','2 a 3 vezes','4 vezes ou mais']},
 destino:{t:'single',q:'O que você fez com o último item descartado?',o:['Doei','Vendi','Solicitei coleta pelo 156','Levei a um ponto de descarte ou à Pedreira','Contratei frete ou caçamba','Deixei na calçada ou em terreno','Guardei em casa','Coloquei no lixo comum','Nunca precisei descartar']},
 dific:{t:'multi',q:'O que dificulta o descarte correto de itens grandes?',o:['Não sei onde descartar','O ponto é longe','Não tenho como transportar','A espera pela coleta é longa','O custo','Falta de tempo','Não aceitam meu item','Nenhuma dificuldade']},
 c156:{t:'single',q:'Você conhece a coleta de itens grandes pelo 156?',o:['Já usei','Conheço, mas nunca usei','Não conhecia']},
 espera:{t:'single',q:'Quanto tempo levou até a coleta?',o:['Menos de 1 semana','1 a 2 semanas','2 a 4 semanas','Mais de 1 mês','Não foi coletado'],if:['c156',['Já usei']]},
 ponto:{t:'single',q:'Você sabe onde fica o ponto de descarte mais próximo da sua casa?',o:['Sim','Não','Acho que não existe nenhum']},
 irreg:{t:'single',q:'Com que frequência você vê descarte irregular de móveis ou entulho perto da sua casa?',o:['Nunca','Raramente','Às vezes','Com frequência']},
 dist:{t:'single',q:'Qual a distância máxima que você aceitaria percorrer para entregar um móvel?',o:['Até 1 km','De 1 a 3 km','De 3 a 5 km','De 5 a 10 km','Mais de 10 km','Só aceitaria coleta em casa']},
 formato:{t:'single',q:'Qual formato você preferiria?',o:['Ponto de entrega fixo','Coleta agendada em casa','Ponto móvel no bairro, em dia marcado','Qualquer um, desde que gratuito']},
 doaria:{t:'scale',q:'Quanto você aceitaria doar um móvel em bom estado para ser reformado por uma cooperativa?',lo:'Nada disposto',hi:'Totalmente disposto'},
 compra:{t:'single',q:'Você compraria um móvel reformado por uma cooperativa?',o:['Sim','Talvez, dependendo do preço e da qualidade','Não']},
 desc:{t:'single',q:'Que desconto em relação ao móvel novo tornaria a compra atraente?',o:['10% a 20%','20% a 40%','40% a 60%','Mais de 60%'],if:['compra',SIM_TALVEZ]},
 incent:{t:'multi',q:'O que mais faria você usar um ponto de entrega?',o:['Ficar perto de casa','Funcionar aos sábados','Ter ajuda para descarregar','Receber comprovante de doação','Divulgação clara de onde e como','Ser gratuito','Receber algum benefício ou desconto']},
 taxa:{t:'single',q:'Você pagaria uma taxa pela coleta em casa?',o:['Não pagaria','Até R$ 20','De R$ 20 a R$ 50','De R$ 50 a R$ 100','Dependeria do item']},
 relato:{t:'area',opt:1,q:'Qual foi a maior dificuldade que você já teve ao descartar um móvel ou item grande? Não é obrigatório, mas a sua resposta agregaria imensamente à pesquisa 💚'},
 sugest:{t:'area',opt:1,q:'Tem alguma sugestão para melhorar o descarte de móveis em Maringá? Também não é obrigatório, mas toda sugestão sua agregaria imensamente à pesquisa 💚'},
 email:{t:'email',q:'Seu e-mail para contato sobre a pesquisa',hint:'Fica guardado separado das suas respostas, que não são ligadas à sua identidade.'}
};
var PAGES=[
 {t:'Bem-vindo(a)! 💚',consent:1,s:'Que alegria ter você aqui! Somos estudantes de Maringá e queremos entender, com a sua ajuda, como tornar o descarte de móveis mais fácil e mais justo para todos. Leva cerca de 5 minutos e não existem respostas certas ou erradas.'},
 {t:'Vamos nos conhecer um pouquinho',s:'Só para entender o seu contexto. Nada aqui identifica você.',q:['cidade','bairro','moradia','idade','veiculo']},
 {t:'Como é o seu dia a dia',s:'Conte como tem sido na prática, sem julgamentos. Toda experiência nos ajuda.',q:['itens','vezes','destino','dific']},
 {t:'O que você já conhece',s:'Tudo bem não conhecer algum serviço: isso também é uma informação valiosa.',q:['c156','espera','ponto','irreg']},
 {t:'Vamos sonhar juntos',s:'Agora imagine uma solução ideal. O que funcionaria de verdade para você?',q:['dist','formato','doaria','compra','desc','incent','taxa']},
 {t:'Quase lá! Obrigado pela paciência',s:'Estamos acabando! As duas perguntas abertas são opcionais, mas cada palavra sua ajuda muito.',q:['relato','sugest','email']}
];
var A={}, pg=0, app=document.getElementById('app');

function val(id){
  var d=Q[id], els=document.querySelectorAll('[name="'+id+'"]');
  if(d.t==='multi'){ var r=[]; els.forEach(function(e){ if(e.checked) r.push(e.value); }); return r; }
  if(d.t==='single'||d.t==='scale'){ var c=document.querySelector('[name="'+id+'"]:checked'); return c?c.value:''; }
  return els[0]?els[0].value.trim():'';
}
function qHtml(id){
  var d=Q[id], h='<div class="q" id="q-'+id+'"><label class="ql">'+d.q+(d.opt?'':' <i>*</i>')+'</label>';
  if(d.t==='single'||d.t==='multi'){
    h+='<div class="opts">'+d.o.map(function(o){return '<label class="opt"><input type="'+(d.t==='single'?'radio':'checkbox')+'" name="'+id+'" value="'+o+'"><span>'+o+'</span></label>';}).join('')+'</div>';
  }else if(d.t==='scale'){
    h+='<div class="scale">'+[1,2,3,4,5].map(function(n){return '<label class="opt"><input type="radio" name="'+id+'" value="'+n+'"><span>'+n+'</span></label>';}).join('')+'</div><div class="sl"><span>1 = '+d.lo+'</span><span>5 = '+d.hi+'</span></div>';
  }else if(d.t==='area'){ h+='<textarea name="'+id+'"></textarea>'; }
  else{ h+='<input type="'+(d.t==='email'?'email':'text')+'" name="'+id+'"'+(d.t==='email'?' autocomplete="email" placeholder="seu@email.com"':'')+'>'; }
  if(d.hint) h+='<div class="hint">'+d.hint+'</div>';
  return h+'</div>';
}
function visible(id){ var c=Q[id].if; return !c||c[1].indexOf(A[c[0]])>-1; }
function sync(){ PAGES[pg].q&&PAGES[pg].q.forEach(function(id){ var el=document.getElementById('q-'+id); if(el) el.style.display=visible(id)?'':'none'; }); }
function restore(){ (PAGES[pg].q||[]).forEach(function(id){ var v=A[id]; if(v==null) return; document.querySelectorAll('[name="'+id+'"]').forEach(function(e){ if(e.type==='checkbox') e.checked=v.indexOf(e.value)>-1; else if(e.type==='radio') e.checked=(e.value===v); else e.value=v; }); }); }

function show(){
  var P=PAGES[pg]; document.getElementById('prog').style.width=(pg/(PAGES.length))*100+'%';
  var h='<div class="step">Etapa '+(pg+1)+' de '+PAGES.length+'</div><h1>'+P.t+'</h1>'+(P.s?'<p class="warm">'+P.s+'</p>':'');
  if(P.consent){
    h+='<div class="tcle">Gostaríamos de convidá-lo(a) a participar da pesquisa e responder ao questionário, cujo objetivo é '+PESQ.objetivo+'. Para isto, a sua participação é muito importante e ela se dará por meio da resposta a este questionário. Informamos que raramente poderão ocorrer possíveis desconfortos ou riscos para a integridade física, mental ou social. Gostaríamos de elucidar que a sua participação é totalmente voluntária, podendo recusar-se a autorizar tal participação, ou mesmo desistir a qualquer momento, sem que isto acarrete qualquer ônus ou prejuízo à sua pessoa. Ressalta-se que as informações serão utilizadas somente para os fins desta pesquisa, e serão tratadas com o mais absoluto sigilo e confidencialidade, de modo a preservar a sua identidade.</div>'+
    '<div class="q" id="q-adulto"><label class="ql">Você tem 18 anos ou mais? <i>*</i></label><div class="opts"><label class="opt"><input type="radio" name="adulto" value="sim"><span>Sim</span></label><label class="opt"><input type="radio" name="adulto" value="nao"><span>Não</span></label></div></div>'+
    '<div class="q" id="q-aceite"><label class="ql">Declaro que fui devidamente esclarecido(a) e concordo em participar VOLUNTARIAMENTE da pesquisa coordenada pelo '+PESQ.coord+' e grupo de pesquisa, composto pelos estudantes '+PESQ.equipe+'. <i>*</i></label><div class="opts"><label class="opt"><input type="radio" name="aceite" value="sim"><span>Sim</span></label><label class="opt"><input type="radio" name="aceite" value="nao"><span>Não</span></label></div></div>';
  }else h+=P.q.map(qHtml).join('');
  h+='<div class="nav">'+(pg>0?'<button class="back" onclick="go(-1)">Voltar</button>':'')+'<button class="next" onclick="go(1)">'+(pg===PAGES.length-1?'Enviar respostas':'Continuar')+'</button></div>';
  app.innerHTML=h; restore(); sync(); window.scrollTo(0,0);
}
function fim(t,m){ document.getElementById('prog').style.width='100%'; app.innerHTML='<div class="end"><h1>'+t+'</h1><p>'+m+'</p><a href="index.html">Voltar ao Re.Ciclo</a></div>'; window.scrollTo(0,0); }
function go(dir){
  var P=PAGES[pg];
  if(dir<0){ pg--; show(); return; }
  var ok=true;
  if(P.consent){
    var ad=document.querySelector('[name=adulto]:checked'), ac=document.querySelector('[name=aceite]:checked');
    document.getElementById('q-adulto').classList.toggle('err',!ad); document.getElementById('q-aceite').classList.toggle('err',!ac);
    if(!ad||!ac) return;
    if(ad.value!=='sim') return fim('Obrigado pelo interesse!','Esta pesquisa é para maiores de 18 anos. Se quiser, peça a um responsável que responda.');
    if(ac.value!=='sim') return fim('Tudo bem, obrigado!','Respeitamos a sua decisão, e nenhuma resposta foi registrada. A porta fica aberta se mudar de ideia. 💚');
    pg++; show(); return;
  }
  P.q.forEach(function(id){
    var el=document.getElementById('q-'+id), d=Q[id], v=val(id);
    if(visible(id)){ A[id]=v; } else { delete A[id]; el.classList.remove('err'); return; }
    var bad=!d.opt&&(d.t==='multi'?!v.length:!v);
    if(d.t==='email'&&!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) bad=true;
    el.classList.toggle('err',bad); if(bad&&ok){ ok=false; el.scrollIntoView({behavior:'smooth',block:'center'}); }
  });
  if(!ok) return;
  if(pg<PAGES.length-1){ pg++; show(); } else enviar();
}
async function post(tab,d){
  if(!BACKEND.url||!BACKEND.key) return 'local';
  try{ var r=await fetch(BACKEND.url+'/rest/v1/'+tab,{method:'POST',headers:{'Content-Type':'application/json',apikey:BACKEND.key,Prefer:'return=minimal'},body:JSON.stringify(d)}); return r.ok?'ok':'erro'; }catch(e){ return 'erro'; }
}
async function enviar(){
  var email=A.email; var resp=Object.assign({},A); delete resp.email;
  var st=await post('respostas',{maior_idade:true,aceite_tcle:true,respostas:resp});
  if(st==='erro'){ alert('Não foi possível enviar agora. Verifique a conexão e tente de novo.'); return; }
  await post('contatos',{email:email,aceite_tcle:true});
  fim('Muito obrigado! 💚','Cada resposta sua nos aproxima de um descarte mais justo e sustentável em Maringá. Foi um prazer ter você aqui!'+(st==='local'?'<div class="warn">Modo de teste: o banco de dados ainda não está conectado, então as respostas não foram salvas.</div>':''));
}
app.addEventListener('change',function(e){ var n=e.target.name; if(Q[n]){ A[n]=val(n); sync(); } });
show();
</script>
</body>
</html>
