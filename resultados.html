<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Resultados — Re.Ciclo Maringá</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0d1117;--paper:#f5f0e8;--moss:#2d5016;--lime:#a8e63d;--mist:#e8f4d4;--mid:#6b7c52;--border:#d4cfc4;--earth:#c4874a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--paper);color:var(--ink);line-height:1.5}
header{background:var(--moss);color:#fff;padding:1rem 1.2rem}
.logo{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:1.2rem}
main{max-width:900px;margin:0 auto;padding:1.5rem 1.2rem 4rem}
h1{font-family:'Playfair Display',Georgia,serif;color:var(--moss);font-size:clamp(1.7rem,5vw,2.3rem);margin-bottom:.4rem}
h2{font-family:'Playfair Display',Georgia,serif;color:var(--moss);margin:2.2rem 0 .8rem;font-size:1.4rem}
.sub{color:var(--mid);margin-bottom:1.2rem}
.login{display:flex;gap:.6rem;flex-wrap:wrap;margin:1rem 0}
input[type=password]{flex:1;min-width:200px;border:1px solid var(--border);border-radius:.7rem;padding:.75rem .9rem;font:inherit}
button{font:inherit;font-weight:700;border:none;border-radius:999px;padding:.75rem 1.6rem;cursor:pointer;background:var(--moss);color:var(--lime)}
.msg{color:#a63a2b;font-size:.9rem;margin-top:.5rem}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:.9rem;margin:1rem 0}
.card{background:#fff;border:1px solid var(--border);border-radius:1rem;padding:1rem 1.1rem}
.card b{display:block;font-family:'Playfair Display',Georgia,serif;font-size:2rem;color:var(--moss);line-height:1.1}
.card span{font-size:.82rem;color:var(--mid)}
.blk{background:#fff;border:1px solid var(--border);border-radius:1rem;padding:1.1rem 1.2rem;margin-bottom:1rem}
.blk h3{font-size:.98rem;margin-bottom:.2rem}.blk small{color:var(--mid);display:block;margin-bottom:.7rem}
.row{display:grid;grid-template-columns:minmax(110px,40%) 1fr 78px;gap:.6rem;align-items:center;font-size:.85rem;margin:.3rem 0}
.track{background:var(--mist);border-radius:999px;height:14px;overflow:hidden}.fill{height:100%;background:var(--moss);border-radius:999px}
.val{text-align:right;font-weight:700;color:var(--moss)}
.txt{background:var(--paper);border-radius:.7rem;padding:.7rem .9rem;margin:.5rem 0;font-size:.9rem}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.8rem}
#out{display:none}
</style>
</head>
<body>
<header><span class="logo">Re.Ciclo · Resultados</span></header>
<main>
<h1>Resultados da pesquisa</h1>
<p class="sub">Painel privado. Digite a senha para ver os dados.</p>
<div class="login" id="login"><input type="password" id="pw" placeholder="Senha" autocomplete="current-password"><button onclick="carregar()">Entrar</button></div>
<div class="msg" id="msg"></div>
<div id="out">
  <div class="top"><div class="sub" id="resumo"></div><button onclick="baixarCsv()">⬇ Baixar planilha (CSV)</button></div>
  <h2>Em destaque</h2><div class="cards" id="cards"></div>
  <div id="corpo"></div>
</div>
</main>
<script>
var BACKEND={url:'https://miqaubeveodxgqfqwvql.supabase.co',key:'sb_publishable_Gbm4W9W3Nlx6QnkLCA75eg_Jfiz5fyj'};
/* s=uma opção, m=várias opções, n=escala 1-5, c=texto curto agrupado, t=texto aberto */
var SECS=[
 ['Quem respondeu',[['cidade','Onde mora','s'],['bairro','Bairro (10 mais citados)','c'],['moradia','Tipo de moradia','s'],['idade','Faixa de idade','s'],['veiculo','Como transporta itens grandes','s']]],
 ['Descarte no dia a dia',[['itens','Itens descartados nos últimos 12 meses','m'],['vezes','Quantas vezes descartou','s'],['destino','O que fez com o último item','s'],['dific','O que dificulta o descarte correto','m']]],
 ['O que a pessoa conhece',[['c156','Conhece a coleta pelo 156','s'],['espera','Tempo de espera da coleta (quem já usou)','s'],['ponto','Sabe onde fica o ponto mais próximo','s'],['irreg','Frequência de descarte irregular perto de casa','s']]],
 ['Como poderia funcionar',[['dist','Distância máxima para entregar um móvel','s'],['formato','Formato preferido','s'],['doaria','Disposição para doar móvel em bom estado (1 a 5)','n'],['compra','Compraria móvel reformado por cooperativa','s'],['desc','Desconto que tornaria a compra atraente','s'],['incent','O que faria usar um ponto de entrega','m'],['taxa','Pagaria taxa pela coleta em casa','s']]],
 ['Respostas abertas',[['relato','Maior dificuldade já enfrentada','t'],['sugest','Sugestões','t']]]
];
var D=null, $=function(i){return document.getElementById(i);};
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function pct(n,b){ return b?Math.round(n*100/b):0; }
function norm(s){ return s.trim().toLowerCase().replace(/\s+/g,' '); }
function bars(list,base){ return list.map(function(x){ var p=pct(x[1],base); return '<div class="row"><span>'+esc(x[0])+'</span><div class="track"><div class="fill" style="width:'+p+'%"></div></div><span class="val">'+p+'% <small style="font-weight:400;color:#6b7c52">('+x[1]+')</small></span></div>'; }).join(''); }
function contar(vals){ var c={}, lab={}; vals.forEach(function(v){ var k=norm(v); if(!k) return; c[k]=(c[k]||0)+1; if(!lab[k]) lab[k]=v.trim(); }); return Object.keys(c).map(function(k){return [lab[k],c[k]];}).sort(function(a,b){return b[1]-a[1];}); }
function bloco(t,sub,html){ return '<div class="blk"><h3>'+esc(t)+'</h3><small>'+sub+'</small>'+html+'</div>'; }
function respondidas(id){ return D.dados.filter(function(r){ var v=r[id]; return Array.isArray(v)?v.length:(v!==undefined&&v!==''); }); }
function conta(id,fn){ var rs=respondidas(id); return {n:rs.length,k:rs.filter(fn).length}; }
function card(num,txt){ return '<div class="card"><b>'+num+'</b><span>'+txt+'</span></div>'; }

function render(){
  var N=D.dados.length; $('resumo').textContent=N+' resposta'+(N===1?'':'s')+' do questionário';
  var a=conta('dist',function(r){return ['Até 1 km','De 1 a 3 km'].indexOf(r.dist)>-1;}),
      b=conta('doaria',function(r){return +r.doaria>=4;}),
      c=conta('compra',function(r){return r.compra!=='Não';}),
      d=conta('destino',function(r){return ['Deixei na calçada ou em terreno','Coloquei no lixo comum'].indexOf(r.destino)>-1;}),
      e=conta('c156',function(r){return r.c156==='Não conhecia';});
  $('cards').innerHTML=card(N,'respostas recebidas')+card(pct(a.k,a.n)+'%','aceitam percorrer até 3 km')+card(pct(b.k,b.n)+'%','muito dispostos a doar (notas 4 e 5)')+card(pct(c.k,c.n)+'%','comprariam móvel reformado (sim ou talvez)')+card(pct(d.k,d.n)+'%','deixaram na calçada/terreno ou no lixo comum')+card(pct(e.k,e.n)+'%','não conheciam a coleta do 156');
  var h='';
  SECS.forEach(function(S){
    h+='<h2>'+S[0]+'</h2>';
    S[1].forEach(function(q){
      var id=q[0], rs=respondidas(id), base=rs.length, html='';
      if(!base){ h+=bloco(q[1],'Sem respostas ainda','<div class="sub">—</div>'); return; }
      if(q[2]==='t'){ html=rs.map(function(r){return '<div class="txt">'+esc(r[id])+'</div>';}).join(''); }
      else if(q[2]==='c'){ html=bars(contar(rs.map(function(r){return r[id];})).slice(0,10),base); }
      else if(q[2]==='n'){ var cs=[1,2,3,4,5].map(function(n){return [String(n),rs.filter(function(r){return +r[id]===n;}).length];}), m=rs.reduce(function(s,r){return s+(+r[id]);},0)/base; html=bars(cs,base)+'<div class="sub" style="margin-top:.5rem">Média: <b>'+m.toFixed(1)+'</b> de 5</div>'; }
      else{ var vals=[]; rs.forEach(function(r){ [].concat(r[id]).forEach(function(v){vals.push(v);}); }); html=bars(contar(vals),base); }
      h+=bloco(q[1],base+' respondente'+(base>1?'s':'')+(q[2]==='m'?' · cada pessoa pôde marcar várias opções':''),html);
    });
  });
  var dm=D.demandas||[], dn=D.denuncias||[];
  h+='<h2>Demandas e denúncias do site</h2>';
  h+=bloco('Demandas registradas por tipo',dm.length+' registros',dm.length?bars(contar(dm.map(function(r){return r.tipo;})),dm.length):'<div class="sub">—</div>');
  h+=bloco('Demandas por bairro (10 mais citados)','',dm.length?bars(contar(dm.map(function(r){return r.bairro;})).slice(0,10),dm.length):'<div class="sub">—</div>');
  h+=bloco('Denúncias por tipo de resíduo',dn.length+' registros',dn.length?bars(contar(dn.map(function(r){return r.tipo;})),dn.length):'<div class="sub">—</div>');
  h+=bloco('Denúncias por local (10 mais citados)','',dn.length?bars(contar(dn.map(function(r){return r.localizacao;})).slice(0,10),dn.length):'<div class="sub">—</div>');
  $('corpo').innerHTML=h;
}
async function carregar(){
  $('msg').textContent='Carregando…';
  try{
    var r=await fetch(BACKEND.url+'/rest/v1/rpc/resultados',{method:'POST',headers:{'Content-Type':'application/json',apikey:BACKEND.key},body:JSON.stringify({senha:$('pw').value})});
    if(!r.ok){ $('msg').textContent='Senha incorreta ou banco indisponível.'; return; }
    D=await r.json(); $('msg').textContent=''; $('login').style.display='none'; $('out').style.display='block'; render();
  }catch(e){ $('msg').textContent='Não foi possível conectar. Verifique a internet.'; }
}
$('pw').addEventListener('keydown',function(e){ if(e.key==='Enter') carregar(); });
function baixarCsv(){
  var cols=[]; SECS.forEach(function(S){ S[1].forEach(function(q){ cols.push(q); }); });
  var q=function(v){ return '"'+String(v==null?'':(Array.isArray(v)?v.join(' | '):v)).replace(/"/g,'""')+'"'; };
  var linhas=[cols.map(function(c){return q(c[1]);}).join(';')];
  D.dados.forEach(function(r){ linhas.push(cols.map(function(c){return q(r[c[0]]);}).join(';')); });
  var blob=new Blob(['\ufeff'+linhas.join('\r\n')],{type:'text/csv;charset=utf-8'}), a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='respostas-reciclo.csv'; document.body.appendChild(a); a.click(); a.remove();
}
</script>
</body>
</html>
